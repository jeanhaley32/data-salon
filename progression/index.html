<title>relayd — architecture over time</title>
<style>
  /* ─────────────────────────────────────────────────────────────
     PALETTE — "Cobalt Plate"
     A cold-paper engineering drawing, not a warm editorial page.
       paper   #ECEFF4   cool tinted stock the plate sits on
       plate   #FFFFFF   the drawing surface
       vellum  #F7F9FC   inset fills (boxes, chips)
       rule    #DCE1EA   hairlines
       ink     #0E1116   near-black with a blue bias
       graphite#59626F   secondary text
       cobalt  #1633E0   primary structural signal
       wash    #E7EAFF   cobalt at 8%
       ember   #F5451B   hot path (message flow)
       ash     #FFEAE3   ember wash
       lime    #C6F224   the one loud accent — rules, ticks, active marks only
       teal    #00786A   terminal / success
     ───────────────────────────────────────────────────────────── */
  :root {
    --paper: #ECEFF4;
    --panel: #ffffff;
    --panel-2: #f7f9fc;
    --line: #dce1ea;
    --rule-strong: #c3cad6;
    --text: #0e1116;
    --muted: #59626f;
    --accent: #1633e0;
    --accent-soft: #e7eaff;
    --hot: #f5451b;
    --hot-soft: #ffeae3;
    --lime: #c6f224;
    --success: #00786a;
    --success-soft: #e2f5f1;
    --edge: #a9b2c2;

    --shadow:
      0 1px 0 rgba(14,17,22,0.04),
      0 2px 4px rgba(14,17,22,0.03),
      0 24px 48px -20px rgba(22,51,224,0.16);

    /* Three type roles, all system-resident — no network fetch.
       display: editorial old-style serif, tight and set large
       mono:    structural metadata, uppercase, wide-tracked
       sans:    the data layer inside the drawing (max legibility) */
    --display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, ui-serif, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, "Cascadia Mono", "Roboto Mono", Consolas, monospace;

    --ease: cubic-bezier(.16,.84,.44,1);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; color: var(--text);
    font-family: var(--sans); overflow-x: hidden; height: 100%;
  }
  body {
    display: flex; flex-direction: column; min-height: 100vh;
    background:
      /* faint drafting grid on cool stock */
      linear-gradient(to right, rgba(22,51,224,0.045) 1px, transparent 1px) 0 0 / 32px 32px,
      linear-gradient(to bottom, rgba(22,51,224,0.045) 1px, transparent 1px) 0 0 / 32px 32px,
      var(--paper);
  }

  /* ── Masthead ───────────────────────────────────────────────── */
  header {
    padding: 2.6rem 5vw 1.2rem;
    max-width: 1320px; width: 100%; margin: 0 auto;
  }
  .rule-top {
    height: 3px; width: 100%;
    background: linear-gradient(to right, var(--accent) 0 22%, var(--lime) 22% 30%, var(--line) 30% 100%);
    margin-bottom: 1.15rem;
  }
  .masthead {
    display: flex; align-items: flex-end; justify-content: space-between;
    flex-wrap: wrap; gap: 1rem 2rem;
  }
  .brand { display: flex; align-items: center; gap: 0.7rem; }
  .brand-mark {
    width: 26px; height: 26px; flex: none;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    clip-path: polygon(0 0, 100% 0, 100% 72%, 72% 100%, 0 100%);
  }
  .brand-mark svg { width: 15px; height: 15px; }
  .kicker {
    font-family: var(--mono); font-size: 0.66rem; font-weight: 600;
    letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted);
    line-height: 1.5;
  }
  .kicker b { color: var(--text); font-weight: 700; letter-spacing: 0.12em; display: block; }
  .masthead-meta {
    font-family: var(--mono); font-size: 0.63rem; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--muted); text-align: right; line-height: 1.7;
  }
  .masthead-meta em { font-style: normal; color: var(--text); }

  main {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start;
    padding: 0 5vw 2.2rem; width: 100%;
  }

  /* ── The plate ──────────────────────────────────────────────── */
  .stage {
    position: relative;
    width: 100%; max-width: 1220px;
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 1.6rem 1.8rem 1.4rem;
    box-shadow: var(--shadow);
    animation: plate-in 720ms var(--ease) both;
  }
  @keyframes plate-in {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
  }
  /* corner ticks — drafting registration marks */
  .stage::before, .stage::after {
    content: ""; position: absolute; width: 14px; height: 14px; pointer-events: none;
  }
  .stage::before {
    top: -1px; left: -1px;
    border-top: 2px solid var(--accent); border-left: 2px solid var(--accent);
  }
  .stage::after {
    bottom: -1px; right: -1px;
    border-bottom: 2px solid var(--accent); border-right: 2px solid var(--accent);
  }

  .stage-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 1rem 1.6rem; flex-wrap: wrap;
    padding-bottom: 0.9rem; margin-bottom: 1.1rem;
    border-bottom: 1px solid var(--line);
  }
  .stage-head-left { display: flex; align-items: baseline; gap: 0.85rem; min-width: 0; }
  .state-index {
    font-family: var(--mono); font-size: 0.72rem; font-weight: 700;
    letter-spacing: 0.1em; color: var(--accent);
    padding-top: 0.15rem;
  }
  h1 {
    font-family: var(--display);
    font-size: clamp(1.5rem, 3.1vw, 2.35rem);
    font-weight: 400; margin: 0; letter-spacing: -0.02em; line-height: 1.06;
  }
  .state-date {
    font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--muted);
    border-left: 2px solid var(--lime); padding-left: 0.6rem; white-space: nowrap;
  }
  /* title swap gets its own micro-motion so the headline feels alive */
  .swap { animation: swap-in 460ms var(--ease) both; }
  @keyframes swap-in {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }

  svg.diagram { width: 100%; height: auto; display: block; overflow: visible; }

  /* ── Drawing primitives ─────────────────────────────────────── */
  .node rect { fill: var(--panel-2); stroke: var(--rule-strong); stroke-width: 1.4; }
  #nRelayd rect { fill: #fbfcff; stroke: var(--accent); stroke-width: 1.6; stroke-opacity: 0.42; }
  .node.term rect { fill: var(--success-soft); stroke: var(--success); stroke-width: 1.7; }
  .node text { fill: var(--text); font-family: var(--sans); }
  .node .sub { fill: var(--muted); font-family: var(--mono); letter-spacing: 0.04em; }
  .node.term text.label { fill: var(--success); }

  .edge { stroke: var(--edge); stroke-width: 1.5; fill: none; }
  .edge.hot { stroke: var(--hot); stroke-width: 2.1; }
  .edge-label {
    fill: var(--muted); font-family: var(--mono); font-size: 9px; letter-spacing: 0.09em;
    text-transform: uppercase;
  }

  .gate rect { fill: var(--panel-2); stroke: var(--rule-strong); stroke-width: 1.2; }
  .gate text { fill: var(--text); font-family: var(--sans); font-size: 10.5px; font-weight: 600; }
  .gate .sub { fill: var(--muted); font-family: var(--mono); font-size: 8.5px; font-weight: 400; }

  .panel-box rect { fill: var(--hot-soft); stroke: var(--hot); stroke-width: 1.2; stroke-dasharray: 4 3; }
  .panel-box text.label {
    fill: #b8320f; font-family: var(--mono); font-weight: 700; font-size: 9px;
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  .panel-box text.item { fill: #964227; font-family: var(--mono); font-size: 8.5px; }

  .admitted rect { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.7; }
  .admitted text.label { fill: var(--accent); font-weight: 700; }

  .morph { transition: transform 660ms var(--ease), opacity 340ms ease; }
  .fade { transition: opacity 340ms ease; }

  @media (prefers-reduced-motion: reduce) {
    .morph, .fade { transition: none; }
    .stage, .swap { animation: none; }
  }

  /* ── Ledger navigation (replaces anonymous dots) ────────────── */
  .controls {
    display: flex; align-items: stretch; gap: 0.9rem;
    margin-top: 1.2rem; padding-top: 1rem;
    border-top: 1px solid var(--line);
  }
  button.nav {
    appearance: none; border: 1px solid var(--line); background: #fff;
    color: var(--muted); width: 2.4rem; flex: none;
    font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: border-color 160ms, color 160ms, background 160ms;
  }
  button.nav:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  button.nav:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.nav:disabled { opacity: 0.28; cursor: default; }

  .dots {
    display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
    gap: 0.55rem; flex: 1; min-width: 0;
  }
  .dot {
    position: relative; appearance: none; border: none; cursor: pointer;
    background: transparent; text-align: left; padding: 0.5rem 0 0.15rem;
    border-top: 2px solid var(--line);
    display: flex; flex-direction: column; gap: 0.18rem; min-width: 0;
    transition: border-color 220ms var(--ease);
  }
  .dot .dot-num {
    font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.14em;
    color: var(--muted); transition: color 180ms;
  }
  .dot .dot-label {
    font-family: var(--sans); font-size: 0.76rem; font-weight: 550; letter-spacing: -0.005em;
    color: var(--muted); line-height: 1.25;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    transition: color 180ms;
  }
  .dot:hover { border-top-color: var(--rule-strong); }
  .dot:hover .dot-label { color: var(--text); }
  .dot[aria-current="true"] { border-top-color: var(--accent); }
  .dot[aria-current="true"] .dot-num { color: var(--accent); }
  .dot[aria-current="true"] .dot-label { color: var(--text); font-weight: 650; }
  /* lime tick rides the active step */
  .dot[aria-current="true"]::after {
    content: ""; position: absolute; top: -2px; left: 0; width: 26px; height: 2px;
    background: var(--lime);
    animation: tick-in 420ms var(--ease) both;
  }
  @keyframes tick-in { from { width: 0; } to { width: 26px; } }
  .dot:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  footer {
    width: 100%; max-width: 1220px; margin: 0 auto;
    padding: 0.9rem 5vw 2rem;
    display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
    font-family: var(--mono); font-size: 0.63rem; letter-spacing: 0.13em;
    text-transform: uppercase; color: var(--muted);
  }
  footer kbd {
    font-family: var(--mono); background: #fff; border: 1px solid var(--line);
    padding: 0.05rem 0.3rem; color: var(--text); font-size: 0.62rem;
  }

  @media (max-width: 720px) {
    .dot .dot-label { display: none; }
    .stage { padding: 1.1rem 1rem 1rem; }
  }
</style>

        nRelayd: { x: 220, y: 40, w: 560, h: 240 },
        gCommands: { x: 598, y: 90, w: 150, h: 44, opacity: 1, text: "commands?" },
        gBudget: { x: 598, y: 158, w: 150, h: 44, opacity: 1, text: "budget / rate gate" },
        gLockdown: { x: 240, y: 90, w: 150, h: 44, opacity: 1, text: "lockdown?" },

        gAnomaly: { opacity: 0 },
        gAdmitted: { opacity: 0 },
        gScheduler: { x: 240, y: 220, w: 330, h: 44, opacity: 1 },
        gApproval: { x: 418, y: 158, opacity: 1 },
        gReview: { opacity: 0 },
        gSocket: { opacity: 0 },
        nShim: { opacity: 0 },
        nClaude: { x: 850, y: 120, w: 130, h: 80 },
        gShortcut: { opacity: 0 }
      },
      edges: "edgesS1"
    },
    {
      title: "Discord joins, six-round review", date: "2026-07-14 → 07-17",
      nodes: {
        nTelegram: { x: 20, y: 60, w: 132, h: 60, text: "Telegram" },
        nDiscord: { x: 20, y: 150, w: 132, h: 60, opacity: 1 },
        nMulti: { x: 210, y: 115, opacity: 1 },
        nRelayd: { x: 398, y: 60, w: 332, h: 150 },
        gCommands: { opacity: 0 },
        gBudget: { opacity: 0 },
        gLockdown: { opacity: 0 },
        gSession: { opacity: 0 },
        gAnomaly: { opacity: 0 },
        gAdmitted: { opacity: 0 },
        gScheduler: { opacity: 0 },
        gApproval: { opacity: 0 },
        gReview: { x: 398, y: 240, w: 332, h: 80, opacity: 1 },
        gSocket: { opacity: 0 },
        nShim: { opacity: 0 },
        nClaude: { x: 798, y: 105, w: 130, h: 60 },
        gShortcut: { opacity: 0 }
      },
      edges: "edgesS2"
    },
    {
      title: "Full gate chain, today", date: "2026-08-07",
      nodes: {
        nTelegram: { x: 20, y: 150, w: 152, h: 70, text: "Telegram" },
        nDiscord: { x: 20, y: 240, w: 152, h: 70, opacity: 1 },
        nMulti: { opacity: 0 },
        nRelayd: { x: 230, y: 40, w: 330, h: 440 },
        gCommands: { x: 250, y: 230, w: 290, h: 34, opacity: 1, text: "/command dispatch", subText: "" },
        gBudget: { x: 250, y: 274, w: 290, h: 34, opacity: 1, text: "budget + per-chat token cap", subText: "" },
        gLockdown: { x: 250, y: 98, w: 290, h: 34, opacity: 1, text: "lockdown check" },
        gSession: { x: 250, y: 142, w: 290, h: 34, opacity: 1, text: "session gate — tailnet re-auth" },
        gAnomaly: { x: 250, y: 186, w: 290, h: 34, opacity: 1, text: "anomaly / style-drift score" },
        gAdmitted: { x: 250, y: 322, w: 290, h: 34, opacity: 1 },
        gScheduler: { opacity: 0 },
        gApproval: { opacity: 0 },
        gReview: { opacity: 0 },
        gSocket: { opacity: 1 },
        nShim: { x: 700, y: 230, opacity: 1 },
        nClaude: { x: 920, y: 220, w: 230, h: 110 },
        gShortcut: { opacity: 1 }
      },
      edges: "edgesS3"
    }
  ];

  let idx = 0;
  const svgEl = document.querySelector("svg");
  const titleEl = document.getElementById("stateTitle");
  const dateEl = document.getElementById("stateDate");
  const dotsEl = document.getElementById("dots");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");

  const indexEl = document.getElementById("stateIndex");
  const pad = n => String(n).padStart(2, "0");

  states.forEach((s, i) => {
    const b = document.createElement("button");
    b.className = "dot";
    b.setAttribute("role", "tab");
    b.setAttribute("aria-label", s.title);
    const num = document.createElement("span");
    num.className = "dot-num";
    num.textContent = pad(i + 1);
    const lab = document.createElement("span");
    lab.className = "dot-label";
    lab.textContent = s.title;
    b.append(num, lab);
    b.addEventListener("click", () => render(i));
    dotsEl.appendChild(b);
  });

  const edgeGroups = ["edgesS0", "edgesS1", "edgesS2", "edgesS3"];

  // Capture each node's authored (default) width/height/text so any state that
  // doesn't override them can be reset back, instead of leaking stale values
  // in from whichever state last set them (matters for back/dot navigation).
  const defaults = {};
  document.querySelectorAll(".node, .gate, .panel-box").forEach(el => {
    if (!el.id) return;
    const rect = el.querySelector("rect");
    const label = el.querySelector("text.label") || el.querySelector("text");
    const sub = el.querySelector("text.sub");
    defaults[el.id] = {
      w: rect ? Number(rect.getAttribute("width")) : undefined,
      h: rect ? Number(rect.getAttribute("height")) : undefined,
      text: label ? label.textContent : undefined,
      subText: sub ? sub.textContent : undefined
    };
  });

  function render(i) {
    idx = i;
    const s = states[i];
    titleEl.textContent = s.title;
    dateEl.textContent = s.date;
    indexEl.textContent = pad(i + 1) + "/" + pad(states.length);
    // retrigger the headline swap animation
    [titleEl, dateEl].forEach(el => {
      el.classList.remove("swap");
      void el.offsetWidth;
      el.classList.add("swap");
    });
    svgEl.setAttribute("aria-label", "Diagram of relayd's architecture, currently showing: " + s.title);

    for (const [id, cfg] of Object.entries(s.nodes)) {
      const el = document.getElementById(id);
      if (!el) continue;
      const def = defaults[id] || {};
      const opacity = cfg.opacity === undefined ? 1 : cfg.opacity;
      el.style.opacity = opacity;
      if (cfg.x !== undefined && cfg.y !== undefined) {
        el.style.transform = "translate(" + cfg.x + "px, " + cfg.y + "px)";
      }
      const rect = el.querySelector("rect");
      const w = cfg.w !== undefined ? cfg.w : def.w;
      const h = cfg.h !== undefined ? cfg.h : def.h;
      if (rect && w !== undefined) rect.setAttribute("width", w);
      if (rect && h !== undefined) rect.setAttribute("height", h);
      const label = el.querySelector("text.label") || el.querySelector("text");
      if (label) label.textContent = cfg.text !== undefined ? cfg.text : def.text;
      const sub = el.querySelector("text.sub");
      if (sub) {
        const subText = cfg.subText !== undefined ? cfg.subText : def.subText;
        sub.textContent = subText || "";
        sub.style.opacity = subText ? 1 : 0;
      }

      // Re-center every text.anchor=middle element inside this node whenever
      // the box width changes, so labels never drift off-center or overflow.
      if (rect && w !== undefined) {
        el.querySelectorAll('text[text-anchor="middle"]').forEach(t => {
          t.setAttribute("x", w / 2);
        });
      }
    }

    edgeGroups.forEach(g => {
      document.getElementById(g).style.opacity = (g === s.edges) ? 1 : 0;
    });

    Array.from(dotsEl.children).forEach((d, di) => {
      d.setAttribute("aria-current", di === i ? "true" : "false");
    });
    prevBtn.disabled = i === 0;
    nextBtn.disabled = i === states.length - 1;
  }

  prevBtn.addEventListener("click", () => { if (idx > 0) render(idx - 1); });
  nextBtn.addEventListener("click", () => { if (idx < states.length - 1) render(idx + 1); });
  window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight" && idx < states.length - 1) render(idx + 1);
    if (e.key === "ArrowLeft" && idx > 0) render(idx - 1);
  });

  render(0);
})();
</script>
